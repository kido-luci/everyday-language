name: feature_vocabulary
description: >-
  Vocabulary feature: the words the learner is collecting, and the cards built
  from them. Data, domain, and presentation as a self-contained package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Workspace packages.
  architecture: ^0.1.0
  app_ui: ^0.1.0
  database: ^0.1.0
  localization: ^0.1.0
  srs: ^0.1.0

  # Third-party.
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  go_router: ^17.3.0
  injectable: ^3.0.0
  get_it: ^9.2.1
  meta: ^1.16.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  test_utils: ^0.1.0

  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  # NativeDatabase.memory() for the data-source tests.
  drift: ^2.22.0
