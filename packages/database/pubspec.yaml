name: database
description: >-
  Centralized Drift/SQLite persistence: every table definition, generated
  bindings, and the AppDatabase lifecycle wrapper. Renamed to `database` by
  `fst create --database drift` to serve as a drop-in replacement for the
  ObjectBox database package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # The cards table stores SRS scheduling state, so it speaks that package's
  # vocabulary rather than duplicating the enums.
  srs: ^0.1.0

  drift: ^2.22.0
  drift_flutter: ^0.2.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.22.0
  flutter_test:
    sdk: flutter
