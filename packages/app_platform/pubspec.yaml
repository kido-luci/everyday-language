name: app_platform
description: Device and platform integrations for the Flutter starter template.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  analytics: ^0.1.0
  architecture: ^0.1.0
  injectable: ^3.0.0

  camera: ^0.12.0+1
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.2.0
  image_picker: ^1.2.3
  permission_handler: ^13.0.0
  share_plus: ^13.3.0
  video_player: ^2.13.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # Receiving text shared from other apps (the share sheet, and Android's
  # text-selection menu).
  #
  # Pinned to 1.8.1, the last release that ships a CocoaPods podspec: 1.9.0
  # moved to Swift Package Manager only, and this project cannot enable SPM.
  # Firebase needs an iOS deployment target of 15.0 while Flutter 3.44
  # hardcodes SPM-generated packages to 13.0, so an SPM build fails outright —
  # see the note in CLAUDE.md. Revisit when that hardcode is gone.
  receive_sharing_intent: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  test_utils: ^0.1.0
