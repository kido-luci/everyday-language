org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both flags were added by the Flutter template, and both must stay for now.
# AGP 9 flipped their defaults to true and warns on each opt-out ("deprecated
# ... will be removed in version 10.0"), but taking that advice today breaks the
# build — so leave them until Flutter and the plugins catch up.
#
# newDsl: the Flutter Gradle plugin still drives the legacy variant API
# (applicationVariants, libraryVariants, testVariants, unitTestVariants), which
# AGP 9 serves only while this is false.
#
# builtInKotlin: eight plugins in this app still apply the Kotlin Gradle plugin
# themselves (camera_android_camerax, firebase_analytics, firebase_remote_config,
# flutter_timezone, image_picker_android, receive_sharing_intent,
# shared_preferences_android, url_launcher_android), and built-in Kotlin refuses
# to coexist with KGP in the same module.
android.newDsl=false
android.builtInKotlin=false
